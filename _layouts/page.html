---
layout: default
---
<article class="c-article">
  <header class="c-header c-article__header">
    <div class="u-container c-header__container">
      <h1 class="c-header__title">{{ page.title }}</h1>
      <img class="c-header__logo" src="{{ site.baseurl }}/assets/img/acmlogo.svg" alt="Truman ACM logo">
    </div>
  </header>

  <div class="c-article__main">
    {{ content }}
  </div>
</article>
